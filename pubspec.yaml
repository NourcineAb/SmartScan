name: smart_scan
description: "SmartScan - A production-ready Flutter OCR and document scanning application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^7.0.0

  # Camera & Image
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  image_cropper: ^12.1.1
  image: ^4.0.0

  # ML Kit (Google)
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_language_id: ^0.13.1
  google_mlkit_translation: ^0.13.1
  
  google_mlkit_entity_extraction: ^0.15.3

  # Firebase
  firebase_core: ^3.12.1
  firebase_analytics: ^11.4.5
  firebase_storage: ^12.4.5
  cloud_firestore: ^5.6.5

  # Local Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  path: ^1.9.1

  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.3.1
  animations: ^2.0.11
  shimmer: ^3.0.0

  # Export & Share
  pdf: ^3.11.3
  share_plus: ^12.0.2
  printing: ^5.14.2

  # Notifications
  flutter_local_notifications: ^21.0.0

  # Audio & Haptics
  audioplayers: ^6.4.0
  haptic_feedback: any

  # Localization
  intl: ^0.20.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  bloc: ^9.2.0

  # Utils
  permission_handler: ^12.0.1
  connectivity_plus: ^7.1.0
  uuid: ^4.5.1
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  # File handling
  file_picker: ^11.0.1
  open_filex: ^4.7.0
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/sounds/
